<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#180018,#520642,#160018);
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
}

.card{
    width:90%;
    max-width:430px;
    padding:30px 20px;
    animation:show 1.2s ease;
}

.photo{
    width:180px;
    height:180px;
    margin:auto;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    box-shadow:0 0 35px #ff55c8;
    animation:photo 1.5s ease;
}

h1{
    margin-top:25px;
    font-size:34px;
}

.message{
    margin-top:25px;
    font-size:18px;
    line-height:1.7;
    opacity:.9;
}

.name{
    color:#ff8cda;
}

button{
    margin-top:30px;
    padding:14px 30px;
    border:0;
    border-radius:30px;
    background:linear-gradient(45deg,#ff2d75,#a832ff);
    color:white;
    font-size:16px;
    font-weight:bold;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes photo{
    from{
        transform:scale(0) rotate(-180deg);
    }
    to{
        transform:scale(1) rotate(0);
    }
}
</style>
</head>

<body>

<div class="card">

    <!-- Demo photo -->
    <img
        class="photo"
        src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=400&q=80"
    >

    <h1>
        Hey <span class="name" id="sisterName">Didi</span> ❤️
    </h1>

    <div class="message">
        Shayad main har baar nahi bolta...<br><br>

        But you are one of the most special
        people in my life. 🥹❤️<br><br>

        Thank you for always being there for me.
        <br><br>

        <b>Happy Raksha Bandhan! 🎀</b>
    </div>

    <button onclick="nextScreen()">
        One More Surprise ✨
    </button>

        <audio id="bgMusic" autoplay loop>
    <source src="videos/Third.mp4" type="audio/mpeg">
    </audio>

</div>

<script>

function nextScreen(){
    window.location.href="page4.html";
}

</script>

</body>
</html>
