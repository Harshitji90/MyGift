<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>A Letter For You ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#68145c,#21001f 60%,#0d000d);
    font-family:Arial,sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:92%;
    max-width:430px;
    text-align:center;
}

.title{
    font-size:30px;
    margin-bottom:45px;
}

.envelope{
    width:300px;
    height:200px;
    margin:auto;
    position:relative;
    cursor:pointer;
    perspective:800px;
}

.base{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(135deg,#ff4f9a,#9c35d7);
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.paper{
    position:absolute;
    width:88%;
    height:170px;
    left:6%;
    top:15px;
    background:#fff7fc;
    color:#4b1748;
    border-radius:8px;
    padding:20px;
    z-index:2;
    transform:translateY(45px);
    transition:1s ease;
}

.flap{
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:105px solid #ff72ad;
    z-index:4;
    transform-origin:top;
    transition:1s ease;
}

.heart{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:45px;
    z-index:5;
    transition:.5s;
}

.envelope.open .flap{
    transform:rotateX(180deg);
    z-index:1;
}

.envelope.open .paper{
    transform:translateY(-100px);
}

.envelope.open .heart{
    opacity:0;
}

.instruction{
    margin-top:55px;
    opacity:.8;
    animation:pulse 1.5s infinite;
}

.message{
    display:none;
    margin-top:35px;
    line-height:1.7;
    font-size:17px;
}

.message.show{
    display:block;
    animation:fade .8s ease;
}

button{
    display:none;
    margin:25px auto 0;
    padding:14px 30px;
    border:0;
    border-radius:30px;
    color:white;
    background:linear-gradient(45deg,#ff2d75,#a832ff);
    font-size:16px;
    font-weight:bold;
}

button.show{
    display:block;
}

@keyframes pulse{
    50%{opacity:.4}
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1 class="title">💌 A Letter For You</h1>

    <div class="envelope" id="envelope" onclick="openLetter()">

        <div class="paper">
            <b>Dear Didi ❤️</b>
            <br><br>
            You are not just my sister,
            you are my forever friend.
            <br><br>
            Thank you for being there for me. 🥹
        </div>

        <div class="base"></div>

        <div class="flap"></div>

        <div class="heart">❤️</div>

    </div>

    <div class="instruction" id="instruction">
        Tap the envelope to open 💌
    </div>

    <div class="message" id="message">
        No matter how much we fight,
        <br>
        you will always be special to me. ❤️
        <br><br>
        <b>Happy Raksha Bandhan, Didi! 🎀</b>
    </div>

    <button id="nextBtn" onclick="nextScreen()">
        Final Surprise ✨
    </button>

    <audio id="bgMusic" autoplay loop>
    <source src="videos/fourth.mp4" type="audio/mpeg">
    </audio>

</div>

<script>

function openLetter(){

    const envelope=document.getElementById("envelope");

    envelope.classList.add("open");

    document.getElementById("instruction").style.display="none";

    setTimeout(()=>{
        document.getElementById("message")
        .classList.add("show");

        document.getElementById("nextBtn")
        .classList.add("show");
    },1000);
}

function nextScreen(){
    window.location.href="page5.html";
}

</script>

</body>
</html>
