<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Raksha Bandhan ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#21001f,#5c084f,#19001d);
    font-family:Arial,sans-serif;
    color:white;
}

.screen{
    text-align:center;
    animation:zoom 1.2s ease;
}

.gift{
    font-size:120px;
    animation:openGift 1.5s ease forwards;
}

h1{
    margin-top:25px;
    font-size:36px;
    animation:text 2s ease;
}

p{
    margin-top:15px;
    font-size:18px;
    opacity:.85;
}

.heart{
    position:absolute;
    font-size:25px;
    animation:float 4s linear infinite;
}

@keyframes zoom{
    from{
        opacity:0;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes openGift{
    0%{transform:scale(.5) rotate(-10deg)}
    50%{transform:scale(1.3) rotate(10deg)}
    100%{transform:scale(1) rotate(0)}
}

@keyframes text{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    0%{
        transform:translateY(100vh) rotate(0);
        opacity:0;
    }
    20%{opacity:1}
    100%{
        transform:translateY(-10vh) rotate(360deg);
        opacity:0;
    }
}
button{
    margin-top:30px;
    padding:14px 30px;
    border:0;
    border-radius:30px;
    background:linear-gradient(45deg,#ff2d75,#a832ff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="screen">

    <div class="gift">🎁</div>

    <h1>Happy Raksha Bandhan ❤️</h1>

    <p>A little surprise made specially for you ✨</p>
    <button onclick='window.location.href="page3.html"'>Continue</button>

    <audio id="bgMusic" autoplay loop>
    <source src="videos/Second.mp4" type="audio/mpeg">
    </audio>

</div>

<script>

function createHeart(){

    const heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML=["❤️","💖","💕","✨"][Math.floor(Math.random()*4)];

    heart.style.left=Math.random()*100+"%";
    heart.style.animationDuration=(3+Math.random()*3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },6000);
}

setInterval(createHeart,350);

</script>

<script>
const music = document.getElementById("bgMusic");

// Last position save karo
setInterval(() => {
    localStorage.setItem("musicTime", music.currentTime);
}, 500);

// Refresh ke baad wahi position
window.addEventListener("load", () => {

    const savedTime = localStorage.getItem("musicTime");

    if (savedTime) {
        music.currentTime = parseFloat(savedTime);
    }

    music.play().catch(() => {
        console.log("Browser ne autoplay block kiya");
    });
});
</script>
</body>
</html>
